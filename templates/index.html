<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Photo Export</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#3b82f6; --accent2:#22c55e;
    --danger:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
         border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:6px}
  .dot.on{background:var(--accent2)}
  .muted{color:var(--muted)}
  .grow{flex:1}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
         padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{border-color:#3d4553}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent}
  input,select{background:#12151b;color:var(--text);border:1px solid var(--line);
               border-radius:7px;padding:6px 8px;font-size:13px}
  input[type=date]{color-scheme:dark}
  .layout{display:flex;flex:1;min-height:0}
  aside{width:270px;background:var(--panel);border-right:1px solid var(--line);
        padding:14px;overflow-y:auto;flex-shrink:0}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
           margin:16px 0 8px}
  aside h3:first-child{margin-top:0}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .row label{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
        padding:5px 10px;font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;align-items:center;gap:10px;padding:9px 16px;
           border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .grid{flex:1;overflow-y:auto;padding:14px;display:grid;
        grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-content:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        cursor:pointer;position:relative;transition:border-color .12s,transform .12s}
  .card:hover{border-color:#3d4553;transform:translateY(-1px)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#0b0d11;display:block}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:#3f4756;font-size:22px}
  .thumb.ph.vid{background:radial-gradient(circle at 50% 45%,#1b2430,#0b0d11 70%);
                color:#93a3b8;font-size:26px;position:relative}
  .thumb.ph.vid::after{content:attr(data-ext);position:absolute;bottom:6px;right:8px;
                       font-size:10px;letter-spacing:.06em;color:#6b7787}
  .meta{padding:7px 9px;font-size:11.5px;color:var(--muted)}
  .meta b{display:block;color:var(--text);font-weight:500;font-size:12px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;top:7px;left:7px;background:#000a;backdrop-filter:blur(4px);
         border-radius:6px;padding:2px 6px;font-size:10px;letter-spacing:.03em;text-transform:uppercase}
  .tags{position:absolute;top:6px;left:6px;display:flex;gap:4px;align-items:center;max-width:calc(100% - 40px)}
  .tags .badge{position:static}
  .badge.exp{background:#16a34acc}
  .badge.pair{background:#7c3aedcc}
  .tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:6px;
        border:1.5px solid #fff9;background:#0006;display:flex;align-items:center;
        justify-content:center;font-size:12px;color:#fff}
  .card.sel .tick{background:var(--accent);border-color:var(--accent)}
  .drawer{width:380px;background:var(--panel);border-left:1px solid var(--line);
          display:none;flex-direction:column;flex-shrink:0}
  .drawer.open{display:flex}
  .drawer .pv{background:#0b0d11;display:flex;align-items:center;justify-content:center;
              min-height:240px;max-height:52vh;overflow:hidden}
  .drawer img,.drawer video{max-width:100%;max-height:52vh;display:block}
  .drawer .body{padding:14px;overflow-y:auto;flex:1}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
      border-bottom:1px dashed #232833;font-size:12.5px}
  .kv span:first-child{color:var(--muted)}
  .bar{position:relative;height:6px;background:#0b0d11;border-radius:4px;overflow:hidden;flex:1;min-width:120px}
  .bar i{position:absolute;inset:0;width:0;background:var(--accent);transition:width .25s}
  .foot{padding:10px 16px;border-top:1px solid var(--line);background:var(--panel);
        display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner{padding:12px 16px;border-radius:10px;margin:12px 16px;font-size:13px}
  .banner.ok{background:#052e16;border:1px solid #14532d;color:#bbf7d0}
  .banner.err{background:#2a0f0f;border:1px solid #5b1a1a;color:#fecaca}
  .banner.warn{background:#2a1f05;border:1px solid #5b441a;color:#fde68a}
  .hidden{display:none!important}
  .spinner{width:26px;height:26px;border:3px solid #2a2f3a;border-top-color:var(--accent);
           border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  code{background:#0b0d11;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>iPhone Photo Export</h1>
  <span id="status"><span class="dot"></span><span id="statusText">iPhone not detected</span></span>
  <span class="grow"></span>
  <label class="muted" for="dest">Destination</label>
  <input id="dest" size="34" placeholder="D:\iphone-backup">
  <button id="btnDest">Save</button>
  <button id="btnConnect" class="primary">Connect iPhone</button>
  <button id="btnRefresh" class="hidden">Refresh</button>
</header>

<div id="banner" class="banner hidden"></div>

<div class="layout">
  <aside>
    <h3>Export location</h3>
    <select id="favorites" aria-label="Favorite export folders" style="width:100%;margin-bottom:8px"><option value="">Favorite folders</option></select>
    <div class="row"><button id="btnDefault" title="Use this folder on future launches">Save as default</button>
      <button id="btnFavorite" title="Save this folder as a favorite">Add favorite</button></div>
    <div class="row" style="margin-top:8px"><button id="btnRemoveFavorite" title="Remove selected favorite">Remove favorite</button></div>
    <h3>Presets</h3>
    <div class="chips" id="presets"></div>

    <h3>Date</h3>
    <div class="row">
      <select id="dateMode">
        <option value="all">All dates</option>
        <option value="older">Custom: before date</option>
        <option value="newer">Newer than</option>
        <option value="between">Between</option>
      </select>
    </div>
    <div class="row" id="rowDate1">
      <label class="muted" for="date1" id="date1Label" style="width:100%">Before
        <input type="date" id="date1" aria-label="Custom before date" style="margin-top:5px;width:100%">
      </label>
    </div>
    <div class="row hidden" id="rowDate2">
      <input type="date" id="date2"> <span class="muted">to</span>
    </div>

    <h3>Type</h3>
    <div id="kinds"></div>

    <h3>Size (MB)</h3>
    <div class="row">
      <input type="number" id="minMb" placeholder="min" style="width:80px">
      <span class="muted">–</span>
      <input type="number" id="maxMb" placeholder="max" style="width:80px">
    </div>

    <h3>Export status</h3>
    <div class="row">
      <select id="exported">
        <option value="any">Any</option>
        <option value="no">Not yet exported</option>
        <option value="yes">Already exported</option>
      </select>
    </div>

    <h3>Filename</h3>
    <div class="row"><input id="q" placeholder="IMG_1234" style="width:100%"></div>

    <div class="row" style="margin-top:14px">
      <label><input type="checkbox" id="keepPairs" checked> Keep Live Photo pairs together</label>
    </div>
    <div class="row">
      <button id="btnClear" class="ghost" style="width:100%">Clear filters</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <select id="viewCategory" aria-label="Category view"><option value="category">Category view</option><option value="all">All media</option></select>
      <select id="categoryKind" aria-label="Media category"><option value="photo">Photos</option><option value="video">Videos</option><option value="live">Live Photos</option></select>
      <select id="displayMode" aria-label="Display mode"><option value="list">Details list</option><option value="grid">Thumbnails</option></select>
      <span id="counts" class="muted">No device connected</span>
      <span class="grow"></span>
      <button id="btnAll">Select all shown</button>
      <button id="btnNone">Clear selection</button>
      <button id="btnSelBig" class="hidden">Only big files</button>
    </div>
    <div id="listWrap" style="overflow:auto;min-height:0;flex:1">
      <table id="mediaTable" style="width:100%;border-collapse:collapse;font-size:12px" aria-label="Media details">
        <thead><tr id="mediaHead"></tr></thead><tbody id="mediaBody"></tbody>
      </table>
    </div>
    <div class="grid hidden" id="grid"></div>
  </main>

  <div class="drawer" id="drawer">
    <div class="pv" id="pv"><span class="muted">Select a file</span></div>
    <div class="body">
      <div id="pvMeta"></div>
      <div class="row" style="margin-top:14px">
        <button id="btnToggle" class="primary" style="width:100%">Include in export</button>
      </div>
      <div class="row">
        <button id="btnCloseDrawer" class="ghost" style="width:100%">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="foot">
  <span id="selInfo" class="muted">Nothing selected</span>
  <div class="bar"><i id="barFill"></i></div>
  <span id="barText" class="muted"></span>
  <select id="exportLayout" aria-label="Export folder structure" title="Export folder structure"><option value="source">Source folders</option><option value="category">Category folders</option><option value="date">Date (YYYY-MM)</option></select>
  <button id="btnVerify" disabled>Verify</button>
  <button id="btnCleanup" class="hidden" title="Delete originals only after verification">Delete verified originals</button>
  <button id="btnExport" class="primary" disabled>Export selected</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { items: [], shown: [], selected: new Set(), device: null, current: null,
                rendered: 0, chunk: 120, job: null, kinds: new Set(),
                category: "category", categoryKind: "photo", display: "list",
                sortKey: "mtime", sortDir: -1, focusPath: null, anchorPath: null,
                lastVerifiedSelection: null, preferences: {favorites: []} };

function api(path, body) {
  return fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    return j;
  });
}

function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(b < 10 ? 1 : 0) + " " + u[i];
}

function banner(msg, kind) {
  const el = $("#banner");
  if (!msg) { el.classList.add("hidden"); return; }
  el.className = "banner " + (kind || "warn");
  el.innerHTML = msg;
}

// ---------- boot ----------
async function boot() {
  try {
    const s = await api("/api/state");
    $("#dest").value = s.dest;
    renderPreferences(s.preferences);
    if (s.fake) banner("Running against a <b>fake device</b> (demo data, no phone).", "warn");
    renderPresets(s.presets);
    renderKinds(s.kinds);
    if (s.connected) {
      setConnected(s.device);
      await refresh();
    }
  } catch (e) { banner(e.message, "err"); }
}

function renderPresets(presets) {
  $("#presets").innerHTML = "";
  presets.forEach(p => {
    const b = document.createElement("div");
    b.className = "chip";
    b.textContent = p.label;
    b.title = p.spec.date ? `Files before ${p.spec.date}` : p.label;
    b.onclick = () => { applyPreset(p.spec); };
    $("#presets").appendChild(b);
  });
}

function renderPreferences(prefs) {
  state.preferences = prefs || {favorites: []};
  $("#favorites").innerHTML = '<option value="">Favorite folders</option>' +
    state.preferences.favorites.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
}
function toast(message, cls = "info") { banner(message, cls); }
async function saveDest() {
  const r = await api("/api/config", {dest: $("#dest").value});
  $("#dest").value = r.dest;
  return r;
}
$("#favorites").onchange = async () => {
  if (!$("#favorites").value) return;
  $("#dest").value = $("#favorites").value;
  await saveDest();
};
$("#btnDefault").onclick = async () => {
  const r = await api("/api/config", {save_default: true});
  renderPreferences(r.preferences); toast("Default export folder saved");
};
$("#btnFavorite").onclick = async () => {
  const r = await api("/api/config", {favorite: $("#dest").value});
  renderPreferences(r.preferences); toast("Favorite export folder saved");
};
$("#btnRemoveFavorite").onclick = async () => {
  if (!$("#favorites").value) return;
  const r = await api("/api/config", {remove_favorite: $("#favorites").value});
  renderPreferences(r.preferences); toast("Favorite removed");
};
$("#viewCategory").onchange = () => { state.category = $("#viewCategory").value;
  $("#categoryKind").classList.toggle("hidden", state.category === "all");
  if (state.category === "all") state.kinds.clear();
  else state.kinds = new Set([state.categoryKind]);
  document.querySelectorAll("#kinds input").forEach(i => i.checked = state.category !== "all" && i.value === state.categoryKind);
  refilter(); };
$("#categoryKind").onchange = () => { state.categoryKind = $("#categoryKind").value;
  document.querySelectorAll("#kinds input").forEach(i => i.checked = i.value === state.categoryKind);
  state.kinds = new Set([state.categoryKind]); refilter(); };
$("#displayMode").onchange = () => { state.display = $("#displayMode").value; renderGrid(); };

function renderKinds(kinds) {
  $("#kinds").innerHTML = "";
  kinds.forEach(k => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<label><input type="checkbox" value="${k.id}"> ${k.label}</label>`;
    row.querySelector("input").onchange = (e) => {
      e.target.checked ? state.kinds.add(k.id) : state.kinds.delete(k.id);
      state.category = "preset";
      $("#viewCategory").value = "all";
      $("#categoryKind").classList.add("hidden");
      applyFilters();
    };
    $("#kinds").appendChild(row);
  });
}

function applyPreset(spec) {
  state.category = "preset";
  $("#viewCategory").value = "all";
  $("#categoryKind").classList.add("hidden");
  $("#dateMode").value = spec.date_mode || "all";
  if (spec.date) $("#date1").value = spec.date;
  if (spec.date_from) $("#date1").value = spec.date_from;
  if (spec.date_to) $("#date2").value = spec.date_to;
  $("#exported").value = spec.exported || "any";
  $("#minMb").value = spec.min_mb || "";
  $("#maxMb").value = spec.max_mb || "";
  state.kinds = new Set(spec.kinds || []);
  document.querySelectorAll("#kinds input").forEach(i => {
    i.checked = state.kinds.has(i.value);
  });
  toggleDateRows();
  applyFilters();
}

function toggleDateRows() {
  const m = $("#dateMode").value;
  $("#rowDate1").classList.toggle("hidden", m === "all");
  $("#rowDate2").classList.toggle("hidden", m !== "between");
  $("#date1Label").firstChild.textContent =
    m === "older" ? "Before" : m === "newer" ? "On or after" : m === "between" ? "From" : "Date";
}

function currentSpec() {
  const m = $("#dateMode").value;
  const spec = {date_mode: m,    kinds: state.category === "category" ? [state.categoryKind] :
      state.category === "preset" ? [...state.kinds] : [],
                exported: $("#exported").value,
                q: $("#q").value, keep_pairs: $("#keepPairs").checked};
  if (m === "older" || m === "newer") spec.date = $("#date1").value;
  if (m === "between") { spec.date_from = $("#date1").value; spec.date_to = $("#date2").value; }
  if ($("#minMb").value) spec.min_mb = +$("#minMb").value;
  if ($("#maxMb").value) spec.max_mb = +$("#maxMb").value;
  return spec;
}

// ---------- connection ----------
function mergeInventory(items) {
  const previous = new Map(state.items.map(i => [i.path, i]));
  state.items = items.map(i => {
    const old = previous.get(i.path);
    return old?.metadata ? {...i, metadata: old.metadata, created: old.created, location: old.location} : i;
  });
}
function setConnected(device) {
  state.device = device;
  $("#status").querySelector(".dot").classList.add("on");
  $("#statusText").textContent = device ? `${device.model || "iPhone"} · iOS ${device.ios || "unknown"} · ${device.name || "Unnamed device"}` : "iPhone not detected";
  $("#btnConnect").textContent = "Disconnect";
  $("#btnRefresh").classList.remove("hidden");
}

async function connect() {
  if (state.device) {
    await api("/api/disconnect", {});
    state.device = null; state.items = []; state.selected.clear();
    $("#status").querySelector(".dot").classList.remove("on");
    $("#statusText").textContent = "iPhone not detected";
    $("#btnConnect").textContent = "Connect iPhone";
    $("#btnRefresh").classList.add("hidden");
    renderGrid(); return;
  }
  banner("Looking for a connected iPhone…", "warn");
  try {
    const devs = await api("/api/devices");
    let udid = null;
    if (devs.devices.length > 1) {
      const list = devs.devices.map((d, i) => `${i + 1}. ${d.name || "iPhone"} (${d.udid})`).join("\n");
      const pick = prompt("Several phones connected — enter a number:\n" + list, "1");
      if (!pick) return;
      udid = devs.devices[(+pick || 1) - 1].udid;
    }
    const r = await api("/api/connect", {udid});
    setConnected(r.device);
    mergeInventory(r.items);
    banner("", null);
    await applyFilters();
  } catch (e) { banner(e.message, "err"); }
}

async function refresh() {
  try {
    const r = await api("/api/refresh", {});
    mergeInventory(r.items);
    await applyFilters();
  } catch (e) { banner(e.message, "err"); }
}

// ---------- filtering + grid ----------
let filterRequest = 0;
async function applyFilters() {
  if (!state.device) return;
  const requestId = ++filterRequest;
  try {
    const r = await api("/api/filter", currentSpec());
    if (requestId !== filterRequest) return;
    state.shown = r.items;
    document.querySelectorAll("#kinds input").forEach(i =>
      i.checked = state.category === "category" ? i.value === state.categoryKind : state.kinds.has(i.value));
    state.rendered = 0;
    // drop selections that are no longer visible
    const visible = new Set(state.shown.map(i => i.path));
    for (const p of [...state.selected]) if (!visible.has(p)) state.selected.delete(p);
    renderGrid();
    updateFoot(r.summary);
  } catch (e) { banner(e.message, "err"); }
}

function updateFoot(sum) {
  if (state.lastVerifiedSelection && (state.lastVerifiedSelection.length !== state.selected.size ||
      state.lastVerifiedSelection.some(p => !state.selected.has(p)))) state.lastVerifiedSelection = null;
  if (sum) state.summary = sum;
  sum = sum || state.summary;
  const n = state.selected.size;
  let bytes = 0;
  for (const it of state.shown) if (state.selected.has(it.path)) bytes += it.size;
  $("#selInfo").textContent = n
    ? `${n} selected · ${fmtBytes(bytes)}`
    : `Nothing selected · ${sum ? sum.count : 0} files shown`;
  $("#btnExport").disabled = n === 0;
  $("#btnVerify").disabled = n === 0;
  const verified = state.lastVerifiedSelection && state.lastVerifiedSelection.length === n &&
    [...state.selected].every(p => state.lastVerifiedSelection.includes(p));
  $("#btnCleanup").classList.toggle("hidden", !verified);
  $("#btnExport").textContent = n ? `Export ${n} files` : "Export selected";
  $("#counts").textContent = sum
    ? `${sum.count} of ${state.items.length} files · ${fmtBytes(sum.bytes)}`
    : "";
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderGrid() {
  $("#listWrap").classList.toggle("hidden", state.display !== "list");
  $("#grid").classList.toggle("hidden", state.display !== "grid");
  const sort = state.sortKey;
  state.shown.sort((a, b) => {
    const av = a[sort] ?? "", bv = b[sort] ?? "";
    return (typeof av === "number" ? av - bv : String(av).localeCompare(String(bv))) * state.sortDir;
  });
  state.rendered = 0;
  if (state.display === "list") renderList();
  else render();
  updateFoot();
}
const COLUMNS = [["name","Filename"],["created","Created"],["date","Modified"],["albums","Albums"],["mb","Size (MB)"],["location","Location"]];
function renderList() {
  $("#mediaHead").innerHTML = '<th style="padding:8px"><input type="checkbox" id="headAll" aria-label="Select all filtered objects"></th>' + COLUMNS.map(([key,label]) =>
    `<th data-sort="${key}" style="padding:8px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)">${label} ${state.sortKey === key ? (state.sortDir > 0 ? "▲" : "▼") : ""}</th>`).join("");
  $("#mediaHead").querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const key = th.dataset.sort;
    if (state.sortKey === key) state.sortDir *= -1; else { state.sortKey = key; state.sortDir = 1; }
    renderGrid();
  });
  $("#headAll").checked = state.shown.length > 0 && state.shown.every(i => state.selected.has(i.path));
  $("#headAll").onclick = () => $("#headAll").checked ? selectAll() : clearSelection();
  $("#mediaBody").innerHTML = state.shown.map(it => `<tr tabindex="0" data-path="${esc(it.path)}" class="${state.selected.has(it.path) ? "sel" : ""}" style="cursor:pointer;border-bottom:1px solid var(--line);background:${state.selected.has(it.path) ? "var(--sel)" : "transparent"}">
    <td style="padding:7px"><input type="checkbox" tabindex="-1" ${state.selected.has(it.path) ? "checked" : ""} aria-label="Select ${esc(it.name)}"></td>
    ${COLUMNS.map(([key]) => `<td style="padding:7px;white-space:nowrap">${esc(key === "created" ? (it.created || "Load in preview") : key === "albums" ? "Unavailable via AFC" : key === "location" ? "Load in preview" : it[key])}</td>`).join("")}</tr>`).join("");
  $("#mediaBody").querySelectorAll("tr").forEach(row => {
    row.onclick = e => selectWithModifiers(row.dataset.path, e);
    row.ondblclick = e => { e.preventDefault(); openPreview(row.dataset.path); };
    row.onfocus = () => { state.focusPath = row.dataset.path; };
  });
}

function render() {
  const grid = $("#grid");
  grid.innerHTML = "";
  state.rendered = 0;
  if (!state.shown.length) {
    grid.innerHTML = `<p class="muted" style="grid-column:1/-1">No files match these filters.</p>`;
    return;
  }
  renderChunk();
  grid.onscroll = () => {
    if (grid.scrollTop + grid.clientHeight > grid.scrollHeight - 400) renderChunk();
  };
}

function renderChunk() {
  const grid = $("#grid");
  const slice = state.shown.slice(state.rendered, state.rendered + state.chunk);
  slice.forEach(it => grid.appendChild(card(it)));
  state.rendered += slice.length;
  updateFoot();
}

function card(it) {
  const el = document.createElement("div");
  el.className = "card" + (state.selected.has(it.path) ? " sel" : "");
  el.dataset.path = it.path;
  const tags = [];
  tags.push(`<span class="badge">${it.is_video ? "video" : (it.kind === "live" ? "live" : it.kind === "screenshot" ? "shot" : "photo")}</span>`);
  if (it.pair_auto) tags.push(`<span class="badge pair">paired</span>`);
  if (it.exported) tags.push(`<span class="badge exp">exported</span>`);
  const icon = it.is_video ? "▶" : "🖼";
  const cls = it.is_video ? "thumb ph vid" : "thumb ph";
  const ext = (it.ext || "").replace(".", "").toUpperCase();
  el.innerHTML = `
    <div class="tags">${tags.join("")}</div>
    <div class="tick" data-role="tick">${state.selected.has(it.path) ? "✓" : ""}</div>
    <div class="${cls}" data-role="thumb" data-ext="${ext}" data-path="${it.path}">${icon}</div>
    <div class="meta"><b title="${it.name}">${it.name}</b>
      ${it.day} · ${it.mb} MB</div>`;
  const thumbEl = el.querySelector('[data-role="thumb"]');
  THUMB_OBS.observe(thumbEl);
  el.querySelector('[data-role="tick"]').onclick = (e) => {
    e.stopPropagation();
    toggleSelect(it.path);
  };
  el.onclick = (event) => {
    if (event.ctrlKey || event.metaKey || event.shiftKey) selectWithModifiers(it.path, event);
    else openPreview(it.path);
  };
  return el;
}

// Thumbnails are pulled one file at a time, max 3 in flight: a 10k library must
// not trigger 10k USB reads because the user scrolled fast.
const thumbQueue = [];
let thumbsActive = 0;
function pumpThumbs() {
  while (thumbsActive < 3 && thumbQueue.length) {
    const el = thumbQueue.shift();
    if (!el.isConnected) continue;
    thumbsActive++;
    loadThumb(el).finally(() => { thumbsActive--; pumpThumbs(); });
  }
}
async function loadThumb(el) {
  const path = el.dataset.path;
  try {
    const res = await fetch("/api/thumb?path=" + encodeURIComponent(path));
    if (res.status !== 200) return;
    const blob = await res.blob();
    const img = document.createElement("img");
    img.className = "thumb";
    img.src = URL.createObjectURL(blob);
    img.alt = "";
    el.replaceWith(img);
  } catch (e) { /* leave the placeholder */ }
}

const THUMB_OBS = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (!en.isIntersecting) return;
    THUMB_OBS.unobserve(en.target);
    thumbQueue.push(en.target);
    pumpThumbs();
  });
}, {root: $("#grid"), rootMargin: "400px"});

function toggleSelect(path) {
  if (state.selected.has(path)) state.selected.delete(path);
  else state.selected.add(path);
  const el = document.querySelector(`.card[data-path="${cssEscape(path)}"]`);
  if (el) {
    el.classList.toggle("sel", state.selected.has(path));
    el.querySelector(".tick").textContent = state.selected.has(path) ? "✓" : "";
  }
  updateFoot();
  if (state.current === path) syncDrawerButton();
}
function selectWithModifiers(path, event = {}) {
  const index = state.shown.findIndex(i => i.path === path);
  if (index < 0) return;
  state.focusPath = path;
  if (event.shiftKey && state.anchorPath) {
    const anchor = state.shown.findIndex(i => i.path === state.anchorPath);
    const lo = Math.min(anchor, index), hi = Math.max(anchor, index);
    if (!event.ctrlKey && !event.additive) state.selected.clear();
    state.shown.slice(lo, hi + 1).forEach(i => state.selected.add(i.path));
  } else if (event.ctrlKey || event.metaKey) {
    if (state.selected.has(path)) state.selected.delete(path); else state.selected.add(path);
    state.anchorPath = path;
  } else {
    state.selected.clear(); state.selected.add(path); state.anchorPath = path;
  }
  refreshSelection();
}
function refreshSelection() {
  document.querySelectorAll(".card").forEach(c => {
    const selected = state.selected.has(c.dataset.path);
    c.classList.toggle("sel", selected); c.querySelector(".tick").textContent = selected ? "✓" : "";
  });
  if (state.display === "list") renderList();
  updateFoot();
  if (state.current) syncDrawerButton();
}
function cssEscape(s) { return s.replace(/["\\]/g, "\\$&"); }

function selectAll() {
  state.shown.forEach(i => state.selected.add(i.path));
  refreshSelection();
}
function clearSelection() {
  state.selected.clear();
  state.lastVerifiedSelection = null;
  document.querySelectorAll(".card").forEach(c => {
    c.classList.remove("sel"); c.querySelector(".tick").textContent = "";
  });
  updateFoot();
}

$("#listWrap").tabIndex = 0;
$("#grid").tabIndex = 0;
function mediaKeydown(event) {
  const keys = ["ArrowUp", "ArrowDown", "PageUp", "PageDown"];
  if (!event.shiftKey || !keys.includes(event.key) || !state.shown.length) return;
  event.preventDefault();
  const current = Math.max(0, state.shown.findIndex(i => i.path === state.focusPath));
  const next = Math.max(0, Math.min(state.shown.length - 1, current +
    (event.key === "ArrowUp" ? -1 : event.key === "ArrowDown" ? 1 : event.key === "PageUp" ? -10 : 10)));
  selectWithModifiers(state.shown[next].path, {shiftKey: true});
  const row = document.querySelector(`#mediaBody tr[data-path="${cssEscape(state.focusPath)}"]`);
  if (row) { row.focus(); row.scrollIntoView({block: "nearest"}); }
  const card = document.querySelector(`.card[data-path="${cssEscape(state.focusPath)}"]`);
  if (card) { card.tabIndex = 0; card.focus(); card.scrollIntoView({block: "nearest"}); }
}
$("#listWrap").addEventListener("keydown", mediaKeydown);
$("#grid").addEventListener("keydown", mediaKeydown);
$("#btnVerify").onclick = async () => {
  const r = await api("/api/verify", {paths: [...state.selected]});
  const matches = r.selected_paths && r.selected_paths.length === state.selected.size &&
    r.selected_paths.every(p => state.selected.has(p));
  state.lastVerifiedSelection = r.ok && matches ? r.selected_paths : null;
  toast(r.ok && matches ? `Verified ${r.expected} selected files. SHA-256 and size checks passed.` :
    (r.ok ? "Verification belongs to a different selection. Export the current selection first." : r.error), r.ok && matches ? "ok" : "err");
  updateFoot();
};
$("#btnCleanup").onclick = async () => {
  const selection = [...state.selected].sort();
  if (!state.lastVerifiedSelection || JSON.stringify(selection) !== JSON.stringify([...state.lastVerifiedSelection].sort())) {
    toast("Select exactly the files from the last verified export first.", "err"); return;
  }
  const confirmation = prompt("This permanently deletes the selected originals from the iPhone. Ensure a second backup exists. Type DELETE to continue:");
  if (confirmation !== "DELETE") return;
  const r = await api("/api/cleanup", {paths: selection, confirm: confirmation});
  state.lastVerifiedSelection = null;
  toast(r.message, r.ok ? "ok" : "err");
  if (r.deleted) await connect();
  updateFoot();
};

// ---------- preview ----------
async function openPreview(path, confirm) {
  const it = state.shown.find(i => i.path === path) || state.items.find(i => i.path === path);
  if (!it) return;
  state.current = path;
  const drawer = $("#drawer");
  drawer.classList.add("open");
  $("#pv").innerHTML = `<div class="spinner"></div>`;
  $("#pvMeta").innerHTML = "";
  try {
    const r = await api("/api/preview", {path, confirm: !!confirm});
    if (r.needs_confirm) {
      $("#pv").innerHTML = `<div style="padding:20px;text-align:center">
        <p>${r.message}</p></div>`;
      $("#pvMeta").innerHTML = `<button id="btnConfirm" class="primary" style="width:100%">
        Download ${r.size_mb.toFixed(0)} MB and preview</button>`;
      $("#btnConfirm").onclick = () => openPreview(path, true);
      return;
    }
    if (r.kind === "video") {
      $("#pv").innerHTML = `<video src="${r.media_url}" controls autoplay muted playsinline></video>`;
    } else {
      $("#pv").innerHTML = `<img src="${r.media_url}" alt="">`;
    }
    $("#pvMeta").innerHTML = `
      <div class="kv"><span>Name</span><span>${r.name}</span></div>
      <div class="kv"><span>Date</span><span>${r.date}</span></div>
      <div class="kv"><span>Size</span><span>${r.size_mb} MB</span></div>
      <div class="kv"><span>Type</span><span>${r.kind_label}</span></div>
      <div class="kv"><span>Status</span><span>${state.selected.has(path) ? "selected for export" : "not selected"}</span></div>`;
    syncDrawerButton();
    const metadata = await api("/api/metadata?path=" + encodeURIComponent(path));
    it.created = metadata.metadata.Created;
    it.location = metadata.metadata.Location;
    it.metadata = metadata.metadata;
    Object.entries(metadata.metadata).forEach(([key, value]) => {
      const row = document.createElement("div"); row.className = "kv";
      const label = document.createElement("span"); label.textContent = key;
      const val = document.createElement("span");
      val.textContent = typeof value === "object" ? JSON.stringify(value, null, 2) : String(value);
      val.style.whiteSpace = "pre-wrap"; val.style.overflowWrap = "anywhere";
      row.append(label, val); $("#pvMeta").appendChild(row);
    });
    renderGrid();
  } catch (e) {
    $("#pv").innerHTML = `<span class="muted">${e.message}</span>`;
  }
}

function syncDrawerButton() {
  const b = $("#btnToggle");
  if (!b || !state.current) return;
  const on = state.selected.has(state.current);
  b.textContent = on ? "Exclude from export" : "Include in export";
  b.classList.toggle("primary", !on);
}

// ---------- export ----------
async function doExport() {
  const paths = [...state.selected];
  if (!paths.length) return;
  banner("Exporting…", "warn");
  $("#btnExport").disabled = true;
  try {
    await api("/api/export", {paths, layout: $("#exportLayout").value});
    pollJob();
  } catch (e) { banner(e.message, "err"); $("#btnExport").disabled = false; }
}

async function pollJob() {
  try {
    const j = await api("/api/export/status");
    state.job = j;
    if (j.state === "running") {
      const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
      $("#barFill").style.width = pct + "%";
      $("#barText").textContent = `${j.done}/${j.total} · ${fmtBytes(j.bytes)} · copied ${j.copied}, resumed ${j.resumed}`;
      setTimeout(pollJob, 900);
      return;
    }
    $("#barFill").style.width = "100%";
    if (j.state === "done") {
      $("#barText").textContent = "done";
      const ok = j.safe_to_delete;
      const note = j.note ? `<div style="margin-top:8px;border-top:1px solid #ffffff22;padding-top:8px">${j.note}</div>` : "";
      banner(
        `<b>${ok ? "Export complete — click Verify before cleanup" : "Export finished with problems"}</b><br>
         copied ${j.copied} · resumed ${j.resumed} · failed ${j.failed} ·
         missing ${j.missing} · size mismatch ${j.mismatch} ·
         hash mismatch ${j.hash_mismatch || 0} · ${j.seconds}s<br>
         <code>${j.out_dir}</code><br><br>
         <b>Before deleting on the phone:</b>
         <ol style="margin:6px 0 0 18px;padding:0">
           <li>VERIFY.txt shows 0 failed / missing / size or hash mismatch</li>
           <li>Play 5 random videos from this folder</li>
           <li>Copy the folder to an external drive</li>
           <li>Delete on iPhone, then empty Recently Deleted</li>
         </ol>${note}`, ok ? "ok" : "err");
      await refresh();
    } else if (j.state === "error") {
      banner("Export failed: " + j.error, "err");
      $("#btnExport").disabled = false;
    }
  } catch (e) { banner(e.message, "err"); }
}

// ---------- wiring ----------
$("#btnConnect").onclick = connect;
$("#btnRefresh").onclick = refresh;
$("#btnAll").onclick = selectAll;
$("#btnNone").onclick = clearSelection;
$("#btnExport").onclick = doExport;
$("#btnCloseDrawer").onclick = () => { $("#drawer").classList.remove("open"); state.current = null; };
$("#btnToggle").onclick = () => { if (state.current) { toggleSelect(state.current); syncDrawerButton(); } };
$("#btnClear").onclick = () => {
  $("#dateMode").value = "all"; $("#exported").value = "any"; $("#q").value = "";
  $("#minMb").value = ""; $("#maxMb").value = "";
  state.kinds.clear();
  document.querySelectorAll("#kinds input").forEach(i => i.checked = false);
  toggleDateRows(); applyFilters();
};
$("#btnDest").onclick = async () => {
  try { const r = await api("/api/config", {dest: $("#dest").value});
        $("#dest").value = r.dest; banner("Destination set to " + r.dest, "ok"); }
  catch (e) { banner(e.message, "err"); }
};
$("#dateMode").onchange = () => { toggleDateRows(); applyFilters(); };
["#date1","#date2","#exported","#minMb","#maxMb"].forEach(s => {
  $(s).onchange = applyFilters;
});
$("#keepPairs").onchange = applyFilters;
let qt; $("#q").oninput = () => { clearTimeout(qt); qt = setTimeout(applyFilters, 300); };

// Keep the server alive only while this tab is open: in browser-fallback mode
// (no WebView2) the server exits when the page stops checking in.
setInterval(() => { fetch("/api/ping").catch(() => {}); }, 5000);

boot();
</script>
</body>
